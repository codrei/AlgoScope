<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="AlgoScope" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="AlgoScope: a code editor that shows how C, C++, Java, C# and Python code runs, step by step, for Data Structures & Algorithms classes." />
    <meta name="theme-color" content="#363583" />
    <title>AlgoScope</title>
  </head>
  <body>
    <div id="root">
      <div class="boot" id="boot" style="max-width: 460px; margin: 18vh auto 0; padding: 0 20px; text-align: center; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; color: #363583">
        <div style="font-size: 26px; font-weight: 800">Algo<span style="color: #c9a700">Scope</span></div>
        <p id="boot-msg" style="font-size: 16px; line-height: 1.5; color: #55557a">Loading AlgoScope…</p>
      </div>
    </div>
    <script>
      // Before the app loads (plain old JavaScript, so it runs in any browser):
      // - a browser too old for the code editor gets an explanation instead of a blank page
      //   (it needs class static blocks and regex lookbehind: iOS 16.4+, Chrome 94+, Firefox 93+);
      // - on slow classroom Wi-Fi the first visit can take a while, so say so instead of looking stuck.
      (function () {
        var ok = true;
        try {
          new Function('class A { static { } }');
          new RegExp('(?<=a)b');
        } catch (e) {
          ok = false;
        }
        var msg = document.getElementById('boot-msg');
        if (!ok) {
          window.__algoscopeTooOld = true;
          msg.innerHTML =
            '<b style="color:#1b1b3a">This browser is too old for AlgoScope.</b><br><br>' +
            'iPhone or iPad: update to iOS 16.4 or newer (Settings, General, Software Update).<br>' +
            'Android: update Chrome from the Play Store.<br>' +
            'Or open <b>codrei.github.io/AlgoScope</b> on a laptop.';
          return;
        }
        setTimeout(function () {
          if (document.getElementById('boot-msg')) {
            msg.innerHTML = 'Still loading… On slow Wi-Fi the first visit can take a minute.<br>Keep this page open; after that AlgoScope opens instantly.';
          }
        }, 15000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
